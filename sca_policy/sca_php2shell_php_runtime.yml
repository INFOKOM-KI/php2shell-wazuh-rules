# The checks read the CLI SAPI (PHP-FPM). Confirm the web SAPI uses the same php.ini.
policy:
  id: "php2shell_php_runtime"
  file: "sca_php2shell_php_runtime.yml"
  name: "PHP2Shell: PHP runtime hardening"
  description: "Checks the PHP settings that the PHP2Shell exploit chains depend on. The checks read the CLI SAPI; confirm the web SAPI uses the same php.ini."
  references:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
    - https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html
  regex_type: "pcre2"

requirements:
  title: "Linux host with the PHP CLI"
  description: "The policy needs the PHP CLI to read runtime settings."
  condition: all
  rules:
    - 'f:/etc/os-release'
    - 'c:php -v -> r:^PHP'

checks:
  - id: 42000
    title: "PHP is patched for PHP2Shell"
    description: "The stable PHP branch is at or above 8.2.35, 8.3.36, 8.4.27, or 8.5.12."
    rationale: "These releases fix CVE-2026-109618 and CVE-2026-109619. PHP 8.1 and older have no upstream fix."
    remediation: "Upgrade PHP or apply the vendor backport, then restart every PHP worker."
    compliance:
      - nist_sp_800-53: ["SI-2"]
      - pci_dss_v4.0: ["6.3.3"]
    condition: all
    rules:
      - >-
        c:php -r '$v=PHP_VERSION; $f=["8.2"=>"8.2.35","8.3"=>"8.3.36","8.4"=>"8.4.27","8.5"=>"8.5.12"]; $b=substr($v,0,3); echo (isset($f[$b]) && version_compare($v,$f[$b],">=")) ? "patched" : "vulnerable";' -> patched

  - id: 42001
    title: "session.upload_progress is disabled"
    description: "PHP does not register the PHP_SESSION_UPLOAD_PROGRESS field. Disable it when applications do not use upload progress."
    rationale: "The upload progress handler is the entry point for the arming probes and the OOM chains. A patched host still benefits from removing an unused parser path."
    remediation: "Set session.upload_progress.enabled = Off in php.ini, the FPM pool, or the Apache vhost, then restart PHP."
    compliance:
      - nist_sp_800-53: ["SI-2"]
      - pci_dss_v4.0: ["6.3.3"]
    condition: all
    rules:
      - 'c:php -i -> r:^session.upload_progress.enabled => Off'

  - id: 42002
    title: "session.upload_progress cleanup is enabled"
    description: "Progress entries are removed after the upload request."
    rationale: "Cleanup removes the session entry that the arming probe leaves behind. It does not replace disabling the feature."
    remediation: "Set session.upload_progress.cleanup = On."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^session.upload_progress.cleanup => On'

  - id: 42003
    title: "session.use_strict_mode is enabled"
    description: "PHP rejects session IDs it did not create."
    rationale: "Strict mode blocks the attacker-supplied session IDs used by the fixation and injection chains."
    remediation: "Set session.use_strict_mode = 1."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^session.use_strict_mode => On'

  - id: 42004
    title: "session.use_only_cookies is enabled"
    description: "PHP accepts session IDs from cookies only."
    rationale: "The arming probes send PHPSESSID as a multipart field. Cookie-only mode rejects that path."
    remediation: "Set session.use_only_cookies = 1."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^session.use_only_cookies => On'

  - id: 42005
    title: "expose_php is disabled"
    description: "PHP does not advertise its version in X-Powered-By."
    rationale: "Scanners read X-Powered-By to choose a target and offsets. Hiding it raises the cost of the first stage."
    remediation: "Set expose_php = Off."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^expose_php => Off'

  - id: 42006
    title: "display_errors is disabled"
    description: "PHP does not print errors to the response."
    rationale: "The public probes use error output to confirm the target and the crash. Error output also leaks paths and session state."
    remediation: "Set display_errors = Off and log errors to a file instead."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^display_errors => Off'

  - id: 42007
    title: "post_max_size is capped at 32 MiB"
    description: "The POST body limit is 32 MiB or less."
    rationale: "The OOM probes send multipart bodies from 12 MB to 512 MB. A lower limit rejects most non-chunked probes before parsing."
    remediation: "Set post_max_size = 32M or lower, and keep upload_max_filesize below it."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - >-
        c:php -r '$v=ini_get("post_max_size"); $u=strtoupper(substr($v,-1)); $n=(int)$v; $m=["K"=>1024,"M"=>1048576,"G"=>1073741824]; $b=isset($m[$u]) ? $n*$m[$u] : $n; echo ($b<=0) ? 999999999 : $b;' -> n:^(\d+) compare <= 33554432

  - id: 42008
    title: "allow_url_include is disabled"
    description: "PHP does not allow include and require to fetch remote URLs."
    rationale: "The syrex FastCGI path sets allow_url_include=On. Disabling it removes that option and limits LFI impact."
    remediation: "Set allow_url_include = Off."
    compliance:
      - nist_sp_800-53: ["SI-2"]
    condition: all
    rules:
      - 'c:php -i -> r:^allow_url_include => Off'

  - id: 42009
    title: "session.save_path is outside the web root"
    description: "The session save path is not stored below a common web root."
    rationale: "A session file inside the web root can be fetched directly, and the include step becomes a plain HTTP request."
    remediation: "Move session.save_path outside the web root, for example to /var/lib/php/sessions, and set permissions to 700 or 1733."
    compliance:
      - nist_sp_800-53: ["AC-3","SC-28"]
    condition: all
    rules:
      - >-
        c:php -r '$p=ini_get("session.save_path"); echo ($p!=="" && preg_match("#(^|;)/(var/www|usr/share/nginx|srv/www|opt/lampp/htdocs)#",$p)) ? "bad" : "ok";' -> ok

  - id: 42010
    title: "max_multipart_body_parts is capped"
    description: "On PHP builds that support the directive, the multipart part limit is 1000 or less."
    rationale: "The nuclei and assetnote probes send 4000 parts in one body. A lower limit rejects the part-flood before PHP builds the array."
    remediation: "Set max_multipart_body_parts = 1000 or lower in php.ini, then restart PHP."
    compliance:
      - nist_sp_800-53: ["SI-2","SC-5"]
    condition: all
    rules:
      - >-
        c:php -r '$v=ini_get("max_multipart_body_parts"); echo ($v!==false && ((int)$v<0 || (int)$v>1000)) ? "bad" : "ok";' -> ok
